<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CSE-A Hub</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Firebase SDK modular imports will be handled in app.js / services -->
</head>
<body>
  <div id="app">
    <!-- Auth View -->
    <div id="auth-view" class="">
      <div class="auth-card">
        <h2>Welcome to CSE-A Hub</h2>
        <p style="color: var(--text-secondary); font-size: 14px;">The private community.</p>
        
        <div id="auth-forms">
          <input type="text" id="auth-username" placeholder="Username (Private)" required autocomplete="off">
          <input type="password" id="auth-password" placeholder="Password" required>
          <div id="signup-fields" class="hidden" style="display: flex; flex-direction: column; gap: 20px; margin-top: -10px;">
            <p style="font-size: 12px; color: var(--danger-color); font-weight: 500;">
              Warning: Your username is private. Do not share it. Everyone will know you by your Display Name.
            </p>
            <input type="text" id="auth-displayname" placeholder="Display Name (Public)">
          </div>
          <button id="btn-login" class="btn-primary" style="width: 100%; margin-top: 20px;">Login</button>
          <button id="btn-toggle-signup" style="width: 100%; padding: 12px; color: var(--accent-color); margin-top: 10px;">Need an account? Sign up</button>
        </div>
      </div>
    </div>

    <!-- Main App Layout -->
    <div id="main-layout" class="layout-wrapper">
      
      <!-- Left Column: Users / Groups -->
      <aside class="column col-left">
        <div class="panel-header">
          <h3 style="font-size: 16px; font-weight: 600;">Community</h3>
        </div>
        <div id="users-list" style="flex: 1; overflow-y: auto; padding: 12px;">
          <!-- Populated by JS -->
        </div>
      </aside>

      <!-- Center Column: Chat -->
      <main class="column col-main">
        <div class="panel-header">
          <h3 id="current-chat-title" style="font-size: 16px; font-weight: 600;">Global Chat</h3>
          <button id="btn-debug" title="Debug / Admin" class="hidden" style="padding: 6px; border-radius: var(--radius-sm); border: 1px solid var(--bg-tertiary);">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          </button>
        </div>
        <div id="chat-messages" style="flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
          <!-- Populated by JS -->
        </div>
        <div style="padding: 16px; border-top: 1px solid var(--bg-tertiary); background-color: var(--bg-secondary);">
          <div style="display: flex; gap: 12px;">
            <input type="text" id="chat-input" placeholder="Message..." style="flex: 1; border-radius: var(--radius-full);">
            <button id="btn-send" style="background-color: var(--accent-color); width: 44px; height: 44px; border-radius: 50%; display: flex; justify-content: center; align-items: center;">
              <svg style="width: 20px; height: 20px; fill: none; stroke: white; stroke-width: 2; stroke-linecap: round;" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            </button>
          </div>
        </div>
      </main>

      <!-- Right Column: Games / Leaderboard -->
      <aside class="column col-right">
        <div class="panel-header">
          <h3 style="font-size: 16px; font-weight: 600;">Play & Rank</h3>
        </div>
        <div style="flex: 1; overflow-y: auto; padding: 12px;">
           <!-- Game Launchers & Leaderboard -->
           <div id="games-container" style="display: flex; flex-direction: column; gap: 12px;">
             <!-- Populated by JS -->
           </div>
        </div>
      </aside>

      <!-- Mobile Bottom Navigation -->
      <nav class="mobile-nav">
        <button class="nav-item active" data-view="chat">
          <svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>Chat</span>
        </button>
        <button class="nav-item" data-view="games">
          <svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          <span>Games</span>
        </button>
        <button class="nav-item" data-view="leaderboard">
          <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 15l-4-4h8l-4 4zM12 3v8"/></svg>
          <span>Rank</span>
        </button>
        <button class="nav-item" data-view="notifications">
          <svg class="nav-icon" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span>Alerts</span>
        </button>
        <button class="nav-item" data-view="profile">
          <svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg>
          <span>Profile</span>
        </button>
      </nav>

    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
